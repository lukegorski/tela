name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (workspace dependency order)
        run: pnpm build
        env:
          # Public client-bundle values, not secrets — they ship to the
          # browser in production. apps/web statically prerenders auth-shell
          # pages whose Supabase browser client throws at construction if
          # these are absent. Placeholders keep the build hermetic: nothing
          # contacts Supabase at build time, and any future page that tries
          # to fetch during prerender fails loudly here instead of silently
          # depending on a live project.
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-publishable-key

      - name: Typecheck
        run: pnpm typecheck

      - name: Test (unit only — integration tests require DB)
        run: pnpm test:unit
