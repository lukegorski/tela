[phases.setup]
nixPkgs = ["nodejs_22", "pnpm-9_x"]

[phases.install]
# --no-production hard-overrides NODE_ENV=production so devDeps (tsc) survive
# the install — same failure mode 0c4598f fixed for web/admin.
cmds = ["pnpm install --frozen-lockfile --no-production"]

[phases.build]
cmds = ["pnpm build"]

[start]
cmd = "pnpm --filter @tela/api start"
